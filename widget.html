<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Widget — Glauco & Yuliia ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #330c18 0%, #1a070d 55%, #0f0408 100%);
      color: #ffffff;
    }
    a.widget-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      height: 100%;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
    }
    .heart-img {
      width: min(36vw, 108px);
      height: min(36vw, 108px);
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(255, 45, 85, 0.35));
      flex-shrink: 0;
    }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .couple {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(14px, 4.4vw, 18px);
      color: rgba(255, 214, 224, 0.92);
      line-height: 1.1;
    }
    .months {
      margin-top: 4px;
      font-size: clamp(18px, 5.6vw, 23px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    .days {
      margin-top: 3px;
      font-size: clamp(11px, 3.2vw, 13px);
      font-weight: 500;
      color: rgba(255, 179, 198, 0.88);
    }
    .hint {
      margin-top: 7px;
      font-size: clamp(10px, 2.8vw, 11.5px);
      color: rgba(255, 255, 255, 0.62);
    }
    /* Layout verticale automatico per widget piccoli/quadrati */
    @media (max-aspect-ratio: 11/10) {
      a.widget-link {
        flex-direction: column;
        text-align: center;
        gap: 6px;
        padding: 10px;
      }
      .heart-img {
        width: min(44vw, 76px);
        height: min(44vw, 76px);
      }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <a class="widget-link" href="./index.html" target="_top">
    <img class="heart-img" id="heartImg" src="previews/month-02.png" alt="3D Heart" />
    <div class="info">
      <div class="couple" id="couple">Glauco &amp; Yuliia</div>
      <div class="months" id="months">2 months together ♥</div>
      <div class="days" id="days">62 days · 1 heart</div>
      <div class="hint" id="hint">Tap to view in 3D ↻</div>
    </div>
  </a>

  <script>
    async function boot() {
      try {
        const res = await fetch('hearts.json?v=' + Date.now());
        const data = await res.json();
        const latest = data.hearts[data.hearts.length - 1];
        if (latest?.preview) document.getElementById('heartImg').src = latest.preview + '?v=' + Date.now();
        document.getElementById('couple').textContent = data.couple;

        const start = new Date(data.startDate + 'T00:00:00');
        const now = new Date();
        const annivDay = data.anniversaryDay || 22;
        const days = Math.max(0, Math.floor((now - start) / 86400000));
        let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
        if (now.getDate() < annivDay) months -= 1;
        months = Math.max(0, months);

        let nextY = now.getFullYear();
        let nextM = now.getMonth();
        if (now.getDate() >= annivDay) {
          nextM += 1;
          if (nextM > 11) { nextM = 0; nextY += 1; }
        }
        const daysUntilNext = Math.max(0, Math.ceil((new Date(nextY, nextM, annivDay) - now) / 86400000));

        const monthsText = months === 1 ? '1 month' : `${months} months`;
        const heartsText = data.hearts.length === 1 ? '1 heart' : `${data.hearts.length} hearts`;
        document.getElementById('months').textContent = `${monthsText} together ♥`;
        document.getElementById('days').textContent = `${days} days · ${heartsText}`;
        document.getElementById('hint').textContent = `Next heart in ${daysUntilNext}d · 3D ↻`;
      } catch (e) {
        console.error(e);
      }
    }
    boot();
  </script>
</body>
</html>
