<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Glauco & Yuliia ♥</title>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Noi Due ♥" />
  <meta name="theme-color" content="#16070c" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Elegant Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #16070c;
      --bg-2: #2b0b16;
      --bg-3: #100509;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 215, 225, 0.16);
      --text-main: #fff7f9;
      --text-soft: rgba(255, 232, 238, 0.72);
      --accent: #ff4d6d;
      --accent-glow: rgba(255, 77, 109, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 50% 34%, rgba(217, 22, 54, 0.28) 0%, rgba(43, 11, 22, 0.7) 42%, var(--bg-1) 82%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg-3) 100%);
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 18px calc(env(safe-area-inset-bottom, 16px) + 14px);
    }

    /* Header */
    header {
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .couple-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(28px, 7vw, 36px);
      letter-spacing: 0.02em;
      margin: 0;
      text-shadow: 0 2px 18px rgba(255, 77, 109, 0.3);
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.01em;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    /* 3D Stage */
    #stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }

    .loader {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-soft);
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .loader.hidden { opacity: 0; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.16);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom controls & collection */
    .bottom-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--glass-border);
      background: rgba(24, 9, 14, 0.62);
      color: var(--text-main);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn-heart {
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.32), rgba(217, 22, 54, 0.22));
      border-color: rgba(255, 117, 143, 0.45);
    }

    .card {
      background: rgba(22, 8, 13, 0.68);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 14px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .heart-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 21px;
      font-weight: 600;
      margin: 0;
    }

    .heart-date {
      font-size: 12px;
      color: var(--text-soft);
      white-space: nowrap;
    }

    .heart-msg {
      margin: 5px 0 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .timeline {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .timeline::-webkit-scrollbar { display: none; }

    .month-chip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .month-chip.active {
      background: rgba(255, 77, 109, 0.22);
      border-color: rgba(255, 117, 143, 0.65);
      box-shadow: 0 0 16px rgba(255, 77, 109, 0.22);
    }
    .month-chip.locked {
      opacity: 0.6;
      border-style: dashed;
      cursor: default;
    }
    .chip-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Floating hearts burst */
    .float-heart {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      font-size: 18px;
      animation: floatUp 1.4s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), -140px) scale(1.3); opacity: 0; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>

  <div class="app">
    <header>
      <h1 class="couple-title" id="coupleTitle">Glauco &amp; Yuliia</h1>
      <div class="counter-pill">
        <span class="pulse-dot"></span>
        <span id="counterText">Calcolo mesi insieme…</span>
      </div>
    </header>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Caricamento cuore 3D…</span>
    </div>

    <div class="bottom-wrap">
      <div class="action-row">
        <button class="btn" id="flipBtn">↻ Gira sul retro</button>
        <button class="btn btn-heart" id="loveBtn">♥</button>
      </div>

      <div class="card">
        <div class="card-top">
          <h2 class="heart-title" id="heartTitle">2 Months Anniversary</h2>
          <span class="heart-date" id="heartDate">22.11.2026</span>
        </div>
        <p class="heart-msg" id="heartMsg">Giralo con il dito per leggere il retro!</p>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const stage = document.getElementById('stage');
    const loaderEl = document.getElementById('loader');
    const flipBtn = document.getElementById('flipBtn');
    const loveBtn = document.getElementById('loveBtn');

    // --- Three.js Scene ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.12, 4.35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    stage.appendChild(renderer.domElement);

    // Studio environment for glossy clearcoat reflections
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // Key + Rim + Fill lights so engraved letters pop beautifully from front and back
    const keyLight = new THREE.DirectionalLight(0xfff5f5, 2.2);
    keyLight.position.set(-2.5, 3.2, 4.0);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffeef2, 2.0);
    backLight.position.set(2.5, 2.8, -4.0);
    scene.add(backLight);

    const rimLight = new THREE.DirectionalLight(0xffb3c1, 0.9);
    rimLight.position.set(3.0, -1.5, 1.5);
    scene.add(rimLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 2.6;
    controls.maxDistance = 6.5;
    controls.target.set(0, -0.08, 0);

    const gltfLoader = new GLTFLoader();
    let currentGroup = null;
    let showingBack = false;
    let targetAzimuth = null;

    function loadHeart(heart) {
      loaderEl.classList.remove('hidden');
      document.getElementById('heartTitle').textContent = heart.title;
      document.getElementById('heartDate').textContent = heart.dateDisplay;
      document.getElementById('heartMsg').textContent = heart.message;

      gltfLoader.load(
        heart.model,
        (gltf) => {
          if (currentGroup) {
            scene.remove(currentGroup);
          }
          const root = gltf.scene;
          const mat = new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(heart.color || '#d91616'),
            metalness: heart.metalness ?? 0.06,
            roughness: heart.roughness ?? 0.18,
            clearcoat: heart.clearcoat ?? 1.0,
            clearcoatRoughness: 0.07,
            reflectivity: 0.9,
          });
          root.traverse((obj) => {
            if (obj.isMesh) {
              obj.material = mat;
            }
          });
          currentGroup = root;
          scene.add(currentGroup);
          loaderEl.classList.add('hidden');
        },
        undefined,
        (err) => {
          console.error('Errore caricamento GLB:', err);
          loaderEl.innerHTML = '<span>Impossibile caricare il modello 3D</span>';
        }
      );
    }

    // Smooth camera flip (front <-> back)
    flipBtn.addEventListener('click', () => {
      showingBack = !showingBack;
      targetAzimuth = showingBack ? Math.PI : 0;
      flipBtn.textContent = showingBack ? '↺ Torna al fronte' : '↻ Gira sul retro';
    });

    controls.addEventListener('start', () => {
      targetAzimuth = null;
    });

    // Cute heart burst button
    loveBtn.addEventListener('click', (e) => {
      const rect = loveBtn.getBoundingClientRect();
      for (let i = 0; i < 7; i++) {
        const span = document.createElement('span');
        span.className = 'float-heart';
        span.textContent = ['♥', '❤️', '✨'][i % 3];
        span.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 40) + 'px';
        span.style.top = (rect.top - 6) + 'px';
        span.style.setProperty('--dx', ((Math.random() - 0.5) * 110) + 'px');
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1450);
      }
    });

    // Date & month math
    function computeTogetherStats(startDateStr, annivDay) {
      const start = new Date(startDateStr + 'T00:00:00');
      const now = new Date();
      const diffDays = Math.max(0, Math.floor((now - start) / 86400000));

      let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
      if (now.getDate() < annivDay) months -= 1;
      months = Math.max(0, months);

      // Next anniversary date
      let nextY = now.getFullYear();
      let nextM = now.getMonth();
      if (now.getDate() >= annivDay) {
        nextM += 1;
        if (nextM > 11) { nextM = 0; nextY += 1; }
      }
      const nextDate = new Date(nextY, nextM, annivDay);
      const daysUntilNext = Math.max(0, Math.ceil((nextDate - now) / 86400000));
      return { months, diffDays, daysUntilNext, nextMonthNum: months + 1 };
    }

    // Boot from hearts.json
    async function init() {
      const res = await fetch('hearts.json?v=' + Date.now());
      const data = await res.json();

      document.getElementById('coupleTitle').textContent = data.couple;
      const stats = computeTogetherStats(data.startDate, data.anniversaryDay || 22);
      const mesiLabel = stats.months === 1 ? '1 mese' : `${stats.months} mesi`;
      document.getElementById('counterText').textContent = `${mesiLabel} insieme ♥ · ${stats.diffDays} giorni`;

      const timeline = document.getElementById('timeline');
      const hearts = data.hearts || [];
      let activeIdx = hearts.length - 1;

      function renderTimeline() {
        timeline.innerHTML = '';
        hearts.forEach((h, idx) => {
          const chip = document.createElement('button');
          chip.className = 'month-chip' + (idx === activeIdx ? ' active' : '');
          chip.innerHTML = `<span class="chip-dot" style="background:${h.color || '#d91616'}"></span><span>Mese ${h.month}</span>`;
          chip.addEventListener('click', () => {
            activeIdx = idx;
            showingBack = false;
            targetAzimuth = 0;
            flipBtn.textContent = '↻ Gira sul retro';
            renderTimeline();
            loadHeart(h);
          });
          timeline.appendChild(chip);
        });

        // Next month teaser chip
        const nextChip = document.createElement('div');
        nextChip.className = 'month-chip locked';
        const nextNum = Math.max((hearts[hearts.length - 1]?.month || 0) + 1, stats.nextMonthNum);
        nextChip.innerHTML = `<span>🔒 Mese ${nextNum} · tra ${stats.daysUntilNext}g</span>`;
        timeline.appendChild(nextChip);
      }

      renderTimeline();
      if (hearts.length > 0) loadHeart(hearts[activeIdx]);
    }

    init();

    // Animation loop (gentle floating + smooth flip)
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (currentGroup) {
        currentGroup.position.y = Math.sin(t * 1.6) * 0.045;
      }

      if (targetAzimuth !== null) {
        const curAz = controls.getAzimuthalAngle();
        let delta = targetAzimuth - curAz;
        while (delta > Math.PI) delta -= 2 * Math.PI;
        while (delta < -Math.PI) delta += 2 * Math.PI;
        if (Math.abs(delta) < 0.01) {
          targetAzimuth = null;
        } else {
          const radius = camera.position.distanceTo(controls.target);
          const nextAz = curAz + delta * 0.1;
          const polar = controls.getPolarAngle();
          camera.position.x = controls.target.x + radius * Math.sin(polar) * Math.sin(nextAz);
          camera.position.z = controls.target.z + radius * Math.sin(polar) * Math.cos(nextAz);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
