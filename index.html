<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Glauco & Yuliia ♥</title>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Us ♥" />
  <meta name="theme-color" content="#16070c" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Elegant Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #16070c;
      --bg-2: #2b0b16;
      --bg-3: #100509;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 215, 225, 0.16);
      --text-main: #fff7f9;
      --text-soft: rgba(255, 232, 238, 0.72);
      --accent: #ff4d6d;
      --accent-glow: rgba(255, 77, 109, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 50% 34%, rgba(217, 22, 54, 0.28) 0%, rgba(43, 11, 22, 0.7) 42%, var(--bg-1) 82%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg-3) 100%);
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 18px calc(env(safe-area-inset-bottom, 16px) + 14px);
    }

    /* Header */
    header {
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .couple-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(28px, 7vw, 36px);
      letter-spacing: 0.02em;
      margin: 0;
      text-shadow: 0 2px 18px rgba(255, 77, 109, 0.3);
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.01em;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    /* 3D Stage */
    #stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }

    .loader {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-soft);
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .loader.hidden { opacity: 0; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.16);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom controls & collection */
    .bottom-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--glass-border);
      background: rgba(24, 9, 14, 0.62);
      color: var(--text-main);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn-heart {
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.32), rgba(217, 22, 54, 0.22));
      border-color: rgba(255, 117, 143, 0.45);
    }

    .card {
      background: rgba(22, 8, 13, 0.68);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 14px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .heart-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 21px;
      font-weight: 600;
      margin: 0;
    }

    .heart-date {
      font-size: 12px;
      color: var(--text-soft);
      white-space: nowrap;
    }

    .heart-msg {
      margin: 5px 0 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .timeline {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .timeline::-webkit-scrollbar { display: none; }

    .month-chip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .month-chip.active {
      background: rgba(255, 77, 109, 0.22);
      border-color: rgba(255, 117, 143, 0.65);
      box-shadow: 0 0 16px rgba(255, 77, 109, 0.22);
    }
    .month-chip.locked {
      opacity: 0.6;
      border-style: dashed;
      cursor: default;
    }
    .chip-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Floating hearts burst */
    .float-heart {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      font-size: 18px;
      animation: floatUp 1.4s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), -140px) scale(1.3); opacity: 0; }
    }

    /* Luxury Illuminated Display Cabinet ("Vetrina") */
    .showcase-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: radial-gradient(circle at 50% 20%, #1c1614 0%, #0b0909 75%);
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 14px) + 12px) 12px calc(env(safe-area-inset-bottom, 14px) + 14px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(24px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .showcase-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .showcase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
      width: 100%;
      margin: 0 auto 12px;
      padding: 0 4px;
    }
    .showcase-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 27px;
      font-weight: 600;
      margin: 0;
      color: #f7ead7;
      text-shadow: 0 2px 14px rgba(255, 206, 138, 0.22);
    }
    .showcase-sub {
      font-size: 11.5px;
      color: rgba(240, 214, 178, 0.68);
      margin-top: 1px;
      letter-spacing: 0.03em;
    }
    .close-btn {
      appearance: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 224, 178, 0.22);
      background: rgba(255, 255, 255, 0.06);
      color: #f7ead7;
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    /* Matte Black Cabinet Frame with Glass Doors */
    .cabinet-frame {
      position: relative;
      flex: 1;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      border-radius: 14px;
      padding: 10px;
      background: linear-gradient(160deg, #1b1817 0%, #0d0b0b 100%);
      border: 2px solid #26211f;
      box-shadow:
        inset 0 0 28px rgba(0, 0, 0, 0.9),
        0 20px 50px rgba(0, 0, 0, 0.75);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .cabinet-frame::-webkit-scrollbar { display: none; }

    /* Subtle glass door reflection & center vertical seam */
    .cabinet-glass-overlay {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      pointer-events: none;
      z-index: 5;
    }
    .cabinet-glass-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 1.5px;
      height: 100vh;
      background: linear-gradient(180deg, rgba(255,244,225,0.22), rgba(255,244,225,0.06) 50%, rgba(255,244,225,0.18));
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
    }
    .cabinet-glass-overlay::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      height: 100vh;
      background: linear-gradient(118deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.015) 28%, transparent 46%, rgba(255,244,225,0.03) 72%, transparent 100%);
    }

    .cabinet-shelves {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Individual Illuminated Shelf Row */
    .cabinet-shelf {
      position: relative;
      border-radius: 6px;
      background: linear-gradient(180deg, #1b1613 0%, #120f0e 58%, #090808 100%);
      border-bottom: 6px solid #161312;
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.75),
        inset 0 2px 10px rgba(255, 212, 148, 0.25);
      overflow: hidden;
    }

    /* Warm Golden LED Strip Under Shelf Top */
    .shelf-led {
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg,
        rgba(255, 216, 155, 0.45) 0%,
        #fff0d1 15%,
        #ffe0aa 50%,
        #fff0d1 85%,
        rgba(255, 216, 155, 0.45) 100%);
      box-shadow:
        0 2px 14px 3px rgba(255, 206, 134, 0.55),
        0 10px 28px 6px rgba(255, 190, 110, 0.24);
    }

    .shelf-bays {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 10px 8px 8px;
      background: linear-gradient(180deg, rgba(255, 210, 145, 0.14) 0%, rgba(255, 190, 110, 0.03) 42%, rgba(0, 0, 0, 0.28) 100%);
    }

    /* Individual Dark Velvet Watch-Style Bay */
    .velvet-bay {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 7px;
      border-radius: 7px;
      background: linear-gradient(180deg, #1c1817 0%, #131010 55%, #0c0a0a 100%);
      border: 1px solid rgba(255, 224, 180, 0.06);
      box-shadow:
        inset 0 8px 14px rgba(0, 0, 0, 0.55),
        inset 0 -3px 6px rgba(0, 0, 0, 0.7),
        0 2px 6px rgba(0, 0, 0, 0.6);
      min-height: 118px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .velvet-bay:active { transform: scale(0.96); }
    .velvet-bay.active {
      border-color: rgba(255, 214, 153, 0.55);
      box-shadow:
        inset 0 0 18px rgba(255, 198, 120, 0.18),
        0 0 14px rgba(255, 190, 110, 0.22);
    }
    .velvet-bay.empty {
      cursor: default;
    }
    .velvet-bay.empty:active { transform: none; }

    /* Velvet Cushion Pillow behind each heart */
    .velvet-cushion {
      position: relative;
      width: 68px;
      height: 70px;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 25%, #2a2423 0%, #181414 68%, #0e0c0c 100%);
      box-shadow:
        inset 0 2px 4px rgba(255, 224, 180, 0.12),
        0 5px 10px rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .bay-heart-img {
      width: 62px;
      height: 62px;
      object-fit: contain;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.78));
      transition: transform 0.2s ease;
    }
    .velvet-bay.active .bay-heart-img {
      transform: scale(1.06);
    }

    .bay-empty-mark {
      font-size: 20px;
      color: rgba(255, 220, 175, 0.14);
      line-height: 1;
    }
    .velvet-bay.next-up .bay-empty-mark {
      color: rgba(255, 210, 150, 0.34);
    }

    /* Engraved Brass Shelf Plaque */
    .bay-plaque {
      width: 100%;
      text-align: center;
      padding: 2px 3px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255, 215, 155, 0.10), rgba(160, 115, 65, 0.06));
      border: 1px solid rgba(255, 218, 165, 0.12);
    }
    .bay-month {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ebd3b0;
      line-height: 1.2;
    }
    .bay-sub {
      font-size: 8.5px;
      color: rgba(235, 211, 176, 0.58);
      line-height: 1.2;
    }
    .velvet-bay.empty .bay-plaque {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 218, 165, 0.06);
    }
    .velvet-bay.empty .bay-month {
      color: rgba(235, 211, 176, 0.36);
    }
    .velvet-bay.next-up .bay-month {
      color: rgba(255, 214, 153, 0.72);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>

  <div class="app">
    <header>
      <h1 class="couple-title" id="coupleTitle">Glauco &amp; Yuliia</h1>
      <div class="counter-pill">
        <span class="pulse-dot"></span>
        <span id="counterText">Counting our days together…</span>
      </div>
    </header>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Loading 3D heart…</span>
    </div>

    <div class="bottom-wrap">
      <div class="action-row">
        <button class="btn" id="flipBtn">↻ Flip to back</button>
        <button class="btn" id="collectionBtn">✦ Collection</button>
        <button class="btn btn-heart" id="loveBtn">♥</button>
      </div>

      <div class="card">
        <div class="card-top">
          <h2 class="heart-title" id="heartTitle">2 Months Anniversary</h2>
          <span class="heart-date" id="heartDate">22.11.2026</span>
        </div>
        <p class="heart-msg" id="heartMsg">Spin it around to read the back!</p>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </div>

  <!-- Luxury Illuminated Display Cabinet -->
  <div class="showcase-overlay" id="showcase">
    <div class="showcase-header">
      <div>
        <h2 class="showcase-title">Our Display Case</h2>
        <div class="showcase-sub" id="showcaseSub">1 heart collected</div>
      </div>
      <button class="close-btn" id="closeShowcase" aria-label="Close">✕</button>
    </div>
    <div class="cabinet-frame">
      <div class="cabinet-glass-overlay"></div>
      <div class="cabinet-shelves" id="showcaseGrid"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const stage = document.getElementById('stage');
    const loaderEl = document.getElementById('loader');
    const flipBtn = document.getElementById('flipBtn');
    const loveBtn = document.getElementById('loveBtn');

    // --- Three.js Scene ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);

    function getIdealDistance() {
      const aspect = window.innerWidth / window.innerHeight;
      // On narrow portrait phones, pull back so the heart fits cleanly with generous margins
      if (aspect < 1) {
        return Math.min(7.2, Math.max(4.8, 3.15 / aspect));
      }
      return 4.4;
    }

    camera.position.set(0, 0.12, getIdealDistance());

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    // Subtle studio environment (kept gentle so shadows & engraving contrast stay rich!)
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.55;

    // Raking Key + Back lights with crisp real-time self-shadowing
    function makeShadowLight(x, y, z, intensity) {
      const l = new THREE.DirectionalLight(0xfff4f4, intensity);
      l.position.set(x, y, z);
      l.castShadow = true;
      l.shadow.mapSize.set(2048, 2048);
      l.shadow.camera.near = 0.5;
      l.shadow.camera.far = 12;
      const d = 1.3;
      l.shadow.camera.left = -d;
      l.shadow.camera.right = d;
      l.shadow.camera.top = d;
      l.shadow.camera.bottom = -d;
      l.shadow.bias = -0.0006;
      l.shadow.normalBias = 0.012;
      scene.add(l);
      return l;
    }

    makeShadowLight(-2.2, 2.8, 2.6, 2.4);
    makeShadowLight(2.2, 2.8, -2.6, 2.2);

    const rimLight = new THREE.DirectionalLight(0xffb3c1, 0.75);
    rimLight.position.set(3.2, -1.2, 1.2);
    scene.add(rimLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 2.8;
    controls.maxDistance = 9.0;
    controls.target.set(0, -0.18, 0);

    const gltfLoader = new GLTFLoader();
    let currentGroup = null;
    let showingBack = false;
    let targetAzimuth = null;

    function loadHeart(heart) {
      loaderEl.classList.remove('hidden');
      document.getElementById('heartTitle').textContent = heart.title;
      document.getElementById('heartDate').textContent = heart.dateDisplay;
      document.getElementById('heartMsg').textContent = heart.message;

      gltfLoader.load(
        heart.model + '?v=' + Date.now(),
        (gltf) => {
          if (currentGroup) {
            scene.remove(currentGroup);
          }
          const root = gltf.scene;
          const mat = new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(heart.color || '#d91616'),
            vertexColors: true,
            metalness: heart.metalness ?? 0.05,
            roughness: heart.roughness ?? 0.20,
            clearcoat: heart.clearcoat ?? 0.95,
            clearcoatRoughness: 0.08,
            reflectivity: 0.85,
          });
          root.traverse((obj) => {
            if (obj.isMesh) {
              obj.material = mat;
              obj.castShadow = true;
              obj.receiveShadow = true;
            }
          });
          currentGroup = root;
          scene.add(currentGroup);
          loaderEl.classList.add('hidden');
        },
        undefined,
        (err) => {
          console.error('Error loading GLB:', err);
          loaderEl.innerHTML = '<span>Could not load 3D heart</span>';
        }
      );
    }

    // Smooth camera flip (front <-> back)
    flipBtn.addEventListener('click', () => {
      showingBack = !showingBack;
      targetAzimuth = showingBack ? Math.PI : 0;
      flipBtn.textContent = showingBack ? '↺ Back to front' : '↻ Flip to back';
    });

    controls.addEventListener('start', () => {
      targetAzimuth = null;
    });

    // Cute heart burst button
    loveBtn.addEventListener('click', (e) => {
      const rect = loveBtn.getBoundingClientRect();
      for (let i = 0; i < 7; i++) {
        const span = document.createElement('span');
        span.className = 'float-heart';
        span.textContent = ['♥', '❤️', '✨'][i % 3];
        span.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 40) + 'px';
        span.style.top = (rect.top - 6) + 'px';
        span.style.setProperty('--dx', ((Math.random() - 0.5) * 110) + 'px');
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1450);
      }
    });

    // Date & month math
    function computeTogetherStats(startDateStr, annivDay) {
      const start = new Date(startDateStr + 'T00:00:00');
      const now = new Date();
      const diffDays = Math.max(0, Math.floor((now - start) / 86400000));

      let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
      if (now.getDate() < annivDay) months -= 1;
      months = Math.max(0, months);

      // Next anniversary date
      let nextY = now.getFullYear();
      let nextM = now.getMonth();
      if (now.getDate() >= annivDay) {
        nextM += 1;
        if (nextM > 11) { nextM = 0; nextY += 1; }
      }
      const nextDate = new Date(nextY, nextM, annivDay);
      const daysUntilNext = Math.max(0, Math.ceil((nextDate - now) / 86400000));
      return { months, diffDays, daysUntilNext, nextMonthNum: months + 1 };
    }

    // Boot from hearts.json
    async function init() {
      const res = await fetch('hearts.json?v=' + Date.now());
      const data = await res.json();

      document.getElementById('coupleTitle').textContent = data.couple;
      const stats = computeTogetherStats(data.startDate, data.anniversaryDay || 22);
      const monthsLabel = stats.months === 1 ? '1 month' : `${stats.months} months`;
      document.getElementById('counterText').textContent = `${monthsLabel} together ♥ · ${stats.diffDays} days`;

      const timeline = document.getElementById('timeline');
      const showcase = document.getElementById('showcase');
      const showcaseGrid = document.getElementById('showcaseGrid');
      const showcaseSub = document.getElementById('showcaseSub');
      const collectionBtn = document.getElementById('collectionBtn');
      const closeShowcase = document.getElementById('closeShowcase');

      const hearts = data.hearts || [];
      let activeIdx = hearts.length - 1;

      const countWord = hearts.length === 1 ? '1 heart' : `${hearts.length} hearts`;
      collectionBtn.textContent = `✦ Collection (${hearts.length})`;
      showcaseSub.textContent = `${countWord} collected`;

      collectionBtn.addEventListener('click', () => {
        renderShowcase();
        showcase.classList.add('open');
      });
      closeShowcase.addEventListener('click', () => showcase.classList.remove('open'));
      showcase.addEventListener('click', (e) => {
        if (e.target === showcase) showcase.classList.remove('open');
      });

      function selectHeart(idx) {
        activeIdx = idx;
        showingBack = false;
        targetAzimuth = 0;
        flipBtn.textContent = '↻ Flip to back';
        renderTimeline();
        renderShowcase();
        loadHeart(hearts[idx]);
      }

      function renderTimeline() {
        timeline.innerHTML = '';
        hearts.forEach((h, idx) => {
          const chip = document.createElement('button');
          chip.className = 'month-chip' + (idx === activeIdx ? ' active' : '');
          chip.innerHTML = `<span class="chip-dot" style="background:${h.color || '#d91616'}"></span><span>Month ${h.month}</span>`;
          chip.addEventListener('click', () => selectHeart(idx));
          timeline.appendChild(chip);
        });

        // Next month teaser chip
        const nextChip = document.createElement('div');
        nextChip.className = 'month-chip locked';
        const nextNum = Math.max((hearts[hearts.length - 1]?.month || 0) + 1, stats.nextMonthNum);
        nextChip.innerHTML = `<span>🔒 Month ${nextNum} · in ${stats.daysUntilNext}d</span>`;
        timeline.appendChild(nextChip);
      }

      function renderShowcase() {
        showcaseGrid.innerHTML = '';
        const byMonth = new Map();
        hearts.forEach((h, idx) => byMonth.set(h.month, { heart: h, idx }));

        const firstMonth = hearts.length > 0 ? Math.min(...hearts.map(h => h.month)) : 1;
        const maxMonth = hearts.length > 0 ? Math.max(...hearts.map(h => h.month)) : 1;
        const totalSlots = Math.max(12, Math.ceil((maxMonth - firstMonth + 4) / 3) * 3);
        const nextUnlockMonth = maxMonth + 1;

        // Build illuminated shelves (3 velvet bays per shelf)
        for (let row = 0; row < totalSlots / 3; row++) {
          const shelf = document.createElement('div');
          shelf.className = 'cabinet-shelf';

          const led = document.createElement('div');
          led.className = 'shelf-led';
          shelf.appendChild(led);

          const bays = document.createElement('div');
          bays.className = 'shelf-bays';

          for (let col = 0; col < 3; col++) {
            const mNum = firstMonth + row * 3 + col;
            const entry = byMonth.get(mNum);
            const bay = document.createElement('div');

            if (entry) {
              const { heart: h, idx } = entry;
              bay.className = 'velvet-bay' + (idx === activeIdx ? ' active' : '');
              bay.innerHTML = `
                <div class="velvet-cushion">
                  <img class="bay-heart-img" src="${h.preview}?v=${Date.now()}" alt="Month ${h.month}" />
                </div>
                <div class="bay-plaque">
                  <div class="bay-month">Month ${h.month}</div>
                  <div class="bay-sub">${h.dateDisplay}</div>
                </div>
              `;
              bay.addEventListener('click', () => {
                selectHeart(idx);
                showcase.classList.remove('open');
              });
            } else {
              const isNext = (mNum === nextUnlockMonth);
              bay.className = 'velvet-bay empty' + (isNext ? ' next-up' : '');
              bay.innerHTML = `
                <div class="velvet-cushion">
                  <span class="bay-empty-mark">${isNext ? '♡' : '·'}</span>
                </div>
                <div class="bay-plaque">
                  <div class="bay-month">Month ${mNum}</div>
                  <div class="bay-sub">${isNext ? `in ${stats.daysUntilNext} days` : 'waiting…'}</div>
                </div>
              `;
            }
            bays.appendChild(bay);
          }

          shelf.appendChild(bays);
          showcaseGrid.appendChild(shelf);
        }
      }

      renderTimeline();
      renderShowcase();
      if (hearts.length > 0) loadHeart(hearts[activeIdx]);
    }

    init();

    // Animation loop (gentle floating + smooth flip)
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (currentGroup) {
        currentGroup.position.y = Math.sin(t * 1.6) * 0.045;
      }

      if (targetAzimuth !== null) {
        const curAz = controls.getAzimuthalAngle();
        let delta = targetAzimuth - curAz;
        while (delta > Math.PI) delta -= 2 * Math.PI;
        while (delta < -Math.PI) delta += 2 * Math.PI;
        if (Math.abs(delta) < 0.01) {
          targetAzimuth = null;
        } else {
          const radius = camera.position.distanceTo(controls.target);
          const nextAz = curAz + delta * 0.1;
          const polar = controls.getPolarAngle();
          camera.position.x = controls.target.x + radius * Math.sin(polar) * Math.sin(nextAz);
          camera.position.z = controls.target.z + radius * Math.sin(polar) * Math.cos(nextAz);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
